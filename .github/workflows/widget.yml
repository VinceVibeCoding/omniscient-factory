name: Widget

on:
  push:
    branches: ["**"]
    tags: ["widget-v*"]
    paths:
      - "widget/**"
      - ".github/workflows/widget.yml"
  pull_request:
    paths:
      - "widget/**"
      - ".github/workflows/widget.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  windows:
    name: Windows installer (NSIS)
    needs: web
    runs-on: windows-latest
    permissions:
      contents: write # draft release on widget-v* tags only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: widget/src-tauri
      - name: Install frontend dependencies
        working-directory: widget
        run: npm ci
      - name: Rust unit tests
        working-directory: widget
        shell: bash
        # generate_context! needs the built frontend (frontendDist) to exist.
        run: |
          npm run build
          cd src-tauri && cargo test
      - name: Build (and draft-release on widget-v* tags)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: widget
          args: --bundles nsis
          tagName: ${{ startsWith(github.ref, 'refs/tags/widget-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/widget-v') && 'Omnigroup __VERSION__' || '' }}
          releaseBody: "Installeur Windows du widget Omnigroup. Couplage : voir widget/README.md."
          releaseDraft: true
          prerelease: false
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnigroup-windows-nsis
          path: widget/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload Cargo.lock (commit it to pin Rust dependencies)
        uses: actions/upload-artifact@v4
        with:
          name: omnigroup-cargo-lock
          path: widget/src-tauri/Cargo.lock
          if-no-files-found: warn
