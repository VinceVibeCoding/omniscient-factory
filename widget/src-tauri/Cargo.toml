[package]
name = "omnigroup"
version = "0.1.0"
description = "Omnigroup: a corner widget showing every running agent of an Omniscient home"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "omnigroup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "=2.8.1"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Plain HTTP to the loopback daemon only: no TLS, no system proxy.
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream"] }
futures-util = "=0.3.34"
tokio = { version = "=1.54.1", features = ["time"] }
# The widget token lives in the Windows Credential Manager (DPAPI, per Windows user).
keyring = { version = "=3.6.3", features = ["windows-native"] }
# Daemon proof (M5): HMAC-SHA256 keyed by the token's SHA-256, over a random nonce.
sha2 = "=0.10.9"
hmac = "=0.12.1"
getrandom = "=0.2.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
