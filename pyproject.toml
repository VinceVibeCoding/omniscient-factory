[project]
name = "omniscient"
version = "0.1.0"
description = "Autonomous agent software factory: sense AI news, ideate, plan, prototype."
authors = [
    { name = "Vincent Lauzier", email = "287529286+VinceVibeCoding@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "claude-agent-sdk>=0.2.180",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "parcha-agentrun>=0.3,<0.4",
    "pydantic>=2.14.3",
    "python-frontmatter>=1.3.0",
    "slack-bolt>=1.30.0",
    "textual>=8.2.8",
    "typer>=0.29.1",
]

[project.scripts]
omniscient = "omniscient.cli:app"

# Package data: uv_build ships every file under src/omniscient/, so the wheel carries
# omniscient/resources/ (agents/*.json, skills/, templates/) read via omniscient.home.packaged().
[tool.uv.build-backend]
module-name = "omniscient"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.ruff.lint.isort]
# The repo's agentrun/ folder holds agent definitions; the import is the PyPI client.
known-third-party = ["agentrun"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
