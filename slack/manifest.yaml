# Slack app manifest for Omniscient.
# Create it at https://api.slack.com/apps -> Create New App -> From a manifest -> paste this.
# Socket Mode: no public URL needed; the bot connects out from your machine.
display_information:
  name: Omniscient
  description: Autonomous idea factory. News digests, idea debates, approvals.
  background_color: "#1d1f21"
features:
  bot_user:
    display_name: omniscient
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # post digests and thread replies
      - channels:history    # read thread replies in public channels you invite it to
      - groups:history      # same, for private channels
      - app_mentions:read   # react when you @omniscient
      - reactions:write     # mark threads as seen / processing
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true        # approval buttons (pursue / reshape / drop, approve PRs, budget)
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
